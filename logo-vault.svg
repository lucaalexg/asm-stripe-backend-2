<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" aria-hidden="true">
  <!-- Outer vault door border -->
  <rect x="4" y="4" width="72" height="72" rx="6" ry="6" stroke="#111" stroke-width="2.5" fill="none"/>
  <!-- Inner ring (recessed door plate) -->
  <circle cx="40" cy="40" r="26" stroke="#111" stroke-width="1.8" fill="none"/>
  <!-- Locking wheel spokes (8 spokes) -->
  <line x1="40" y1="14" x2="40" y2="66" stroke="#111" stroke-width="1.5"/>
  <line x1="14" y1="40" x2="66" y2="40" stroke="#111" stroke-width="1.5"/>
  <line x1="21.6" y1="21.6" x2="58.4" y2="58.4" stroke="#111" stroke-width="1.5"/>
  <line x1="58.4" y1="21.6" x2="21.6" y2="58.4" stroke="#111" stroke-width="1.5"/>
  <!-- Center hub -->
  <circle cx="40" cy="40" r="5" stroke="#111" stroke-width="1.5" fill="none"/>
  <circle cx="40" cy="40" r="2" fill="#111"/>
  <!-- Bolt locks on right side -->
  <rect x="68" y="24" width="6" height="5" rx="1" fill="#111"/>
  <rect x="68" y="51" width="6" height="5" rx="1" fill="#111"/>
  <!-- Bolt locks on left side -->
  <rect x="6" y="24" width="6" height="5" rx="1" fill="#111"/>
  <rect x="6" y="51" width="6" height="5" rx="1" fill="#111"/>
</svg>
